<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas Km 42</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
    h1 { color: #ff4d4d; }
    .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn-moto { background: #ff9800; }
    .btn-robo { background: #e53935; }
    #estado { margin-top: 20px; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>

  <h1>🚨 Alertas Barrio Km 42</h1>
  <p>Sistema Vecinal de Emergencias</p>

  <button class="btn btn-moto" onclick="enviarAlerta('Sospechoso en Moto')">🛵 Sospechoso en Moto</button>
  <button class="btn btn-robo" onclick="enviarAlerta('Robo / Emergencia')">🚨 Robo / Emergencia</button>

  <p id="estado">Conectando con el sistema...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfLOGH0iNMNxuq-7kdZq4-FcZ0...",
      authDomain: "alertas-barrio42.firebaseapp.com",
      projectId: "alertas-barrio42",
      storageBucket: "alertas-barrio42.firebasestorage.app",
      messagingSenderId: "311506369120",
      appId: "1:311506369120:web:1b8367e87a55a232956105"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Activar Notificaciones Push
    const messaging = getMessaging(app);
    Notification.requestPermission().then((permission) => {
      if (permission === 'granted') {
        getToken(messaging, { vapidKey: 'BIFsuvtcLM7850oYzjsDMWDZxnsd1rZyfZyvvr8LllB8Op6BS2eNfcp-K5wPeoJiTJIRi6S95aBJ8tpZrg49clo' }).then((currentToken) => {
          if (currentToken) {
            console.log("Token del vecino:", currentToken);
          }
        });
      }
    });

    // Enviar alertas a Firestore
    window.enviarAlerta = async function(tipo) {
      try {
        await addDoc(collection(db, "mensajes"), {
          texto: tipo,
          fecha: new Date()
        });
        alert("Alerta enviada: " + tipo);
      } catch (e) {
        alert("Error al enviar: " + e.message);
      }
    };

    // Escuchar última alerta
    const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"), limit(1));
    onSnapshot(q, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const data = change.doc.data();
          document.getElementById("estado").innerText = "Última alerta: " + data.texto;
        }
      });
    });
  </script>
</body>
</html>
